<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            border-collapse: collapse;
        }
        td,th{
            border: 1px solid black;
            padding: 10px 20px;
        }
    </style>

</head>
<body>
    <main>
        <h2>Friends</h2>
        <table>
            <caption>My Friend Collection</caption>
            <thead>
                <tr>
                   <th>No</th>
                   <th>First Name</th>
                   <th>Last Name</th>
                   <th>Age</th>
                </tr>

            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Priya</td>
                    <td>Bondu</td>
                    <td>17</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Amit</td>
                    <td>Sheikh</td>
                    <td>25</td>
                </tr>
            </tbody>
            <tfoot>
                <td colspan="4">Total Friend 3</td>
            </tfoot>
        </table>
    </main>
    <section>
        <h2>Table Info</h2>
        <ul>
            <li>Table: table</li>
            <li>Table head: thead</li>
            <li>table body: tbody</li>
            <li>table foot: tfoot</li>
            <li>table row: tr</li>
            <li>table data: td</li>
            <li>th</li>
        </ul>

    </section>
</body>
</html>
