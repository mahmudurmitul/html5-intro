<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitha Ghor</title>
    <style>
        form .Basic label{
          display: block;
        }
    </style>
</head>
<body>
   <main>
    <section>
        <form>
            <label for="name">Your Name</label>
            <input type="text" name="" id="name">
             <label for="email">Your Email</label>
             <input type="text" id="name">

            <fieldset class="Basic">
                <legend>Pitha Info</legend>

                <input type="radio" name="pitha" id="Citoy">
                <label for="Citoy">Chitoy</label>
                <input type="radio" name="pitha" id="vapa">
                <label for="vapa">Vapa</label> 
            </fieldset> 
            
            <fieldset>
                <legend>Vorta Selection</legend>
                
                <input type="checkbox" name="Vorta" id="Sorisa">
                <label for="Sorisa">Sorisa Vorta</label>

                <input type="checkbox" name="Vorta" id="Shutki">
                <label for="Shutki">Shutki</label>
            </fieldset>

            <fieldset>
                <legend>Extra Info</legend>
                <textarea cols="50" rows="4" name="" id=""></textarea>
            </fieldset>
            <input type="submit" value="Submit">
            <input type="reset" value="Clear">
        </form>
    </section>
   </main> 
</body>
</html>
